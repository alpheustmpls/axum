[package]
name = "app"
edition = "2024"

[dependencies]
axum = "~0.8.9"
axum-server = { version = "~0.8.0", features = ["tls-rustls"] }
axum-test = "^20.0.0"
axum_typed_multipart = "~0.16.5"
dotenv_plus = "~0.5.1"
jder_axum = { version = "~0.11.0", features = ["typed_multipart", "request_body_limit", "request_time_limit", "utoipa"] }
rustls = { version = "~0.23.40", features = ["ring"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "^1.48.0", features = ["full"] }
tower = "~0.5.2"
tower-http = { version = "~0.6.8", features = ["fs", "cors", "compression-gzip"] }
tstr = "0.3.2"
utoipa = { version = "^5.4.0", features = ["macros"] }
utoipa-axum = "~0.2.0"
utoipa-scalar = { version = "~0.3.0", features = ["axum"] }
workspace_root = { version = "~0.2.0", features = ["tokio"] }
